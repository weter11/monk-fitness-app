org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP 2.2 registers its generated sources through kotlin.sourceSets, which built-in Kotlin
# rejects; AGP names this flag as the migration path until the processor uses android.sourceSets.
android.disallowKotlinSourceSets=false
